<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Period.</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="calendar-panel" aria-label="Period calendar">
      <header class="app-header">
        <h1>Period.</h1>
        <p class="helper-text" id="helperText">Tap a date to mark your period.</p>
      </header>

      <div class="calendar-header">
        <button class="icon-button" id="prevMonth" type="button" aria-label="Previous month">&lsaquo;</button>
        <h2 id="monthLabel"></h2>
        <button class="icon-button" id="nextMonth" type="button" aria-label="Next month">&rsaquo;</button>
      </div>

      <div class="weekdays" aria-hidden="true">
        <span>Sun</span>
        <span>Mon</span>
        <span>Tue</span>
        <span>Wed</span>
        <span>Thu</span>
        <span>Fri</span>
        <span>Sat</span>
      </div>

      <div id="calendar" class="calendar-grid"></div>

      <footer class="calendar-footer">
        <p id="monthSummary" class="month-summary">0 days marked this month</p>
        <button id="clearMonth" class="text-button" type="button">Clear month</button>
      </footer>

      <section class="backup-panel" aria-label="Backup period history">
        <p class="backup-copy">Saved on this device only.</p>
        <div class="backup-actions">
          <button id="exportHistory" class="text-button small-button" type="button">Export history</button>
          <label class="text-button small-button file-button" for="importHistory">Import history</label>
          <input id="importHistory" class="file-input" type="file" accept="application/json,.json">
        </div>
        <p id="backupStatus" class="backup-status" role="status" aria-live="polite"></p>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
