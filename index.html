<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Period.</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="calendar-panel" aria-label="Period calendar">
      <header class="app-header">
        <h1>Period.</h1>
      </header>

      <div class="calendar-header">
        <button class="icon-button" id="prevMonth" type="button" aria-label="Previous month">&lsaquo;</button>
        <h2 id="monthLabel"></h2>
        <button class="icon-button" id="nextMonth" type="button" aria-label="Next month">&rsaquo;</button>
      </div>

      <div class="weekdays" aria-hidden="true">
        <span>Sun</span>
        <span>Mon</span>
        <span>Tue</span>
        <span>Wed</span>
        <span>Thu</span>
        <span>Fri</span>
        <span>Sat</span>
      </div>

      <div id="calendar" class="calendar-grid"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
